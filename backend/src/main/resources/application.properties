# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pujapath_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Initial Data Seeding
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# JWT Security
pujapath.jwt.secret=${JWT_SECRET:DurgaPujaKolkataSecretKey2026NorthKolkataHeritageTokenPandalHopper}
pujapath.jwt.expiration-ms=86400000

# CORS Allowed Origins
pujapath.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173}
